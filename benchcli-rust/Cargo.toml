[package]
name = "benchcli-rust"
version = "0.1.0"
edition = "2024"
publish = false

# Pinned by Cargo.lock beside it, as frameworks/tokio_tungstenite is.
[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
