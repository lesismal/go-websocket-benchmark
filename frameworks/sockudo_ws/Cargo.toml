[package]
name = "sockudo_ws_server"
version = "0.1.0"
edition = "2024"
publish = false

# Pinned, with Cargo.lock beside it, so every run measures the same library; see README.md.
[dependencies]
sockudo-ws = { version = "=2.1.0", default-features = false, features = ["simd", "tokio-runtime", "fastrand"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
bytes = "1"
httparse = "1"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }

# sockudo-ws's own release profile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
