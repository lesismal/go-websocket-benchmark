[package]
name = "tokio_tungstenite_server"
version = "0.1.0"
edition = "2024"
publish = false

# Pinned, with Cargo.lock beside it, so every run measures the same library; see README.md.
[dependencies]
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
httparse = "1"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
