# Runs script/docker_benchmark.sh on an x86_64 runner.
#
# Runs the full matrix on every push to main, and can also be started by hand
# from the Actions tab with the inputs below - the same knobs script/config.sh
# documents. A push has no inputs, so every one of them falls back to the
# default given in the job's env block.
#
# The benchmark gets 8 CPUs, which the standard GitHub-hosted runner (a shared
# 4-CPU VM) does not have. Point the repository variable DOCKER_BENCH_RUNNER
# (Settings > Secrets and variables > Actions > Variables) at the label of a
# runner with at least 8 CPUs - a larger GitHub-hosted runner or a self-hosted
# one. Until it is set, the job runs on ubuntu-24.04 and stops at the CPU check.
name: Docker benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke: short gorilla-only run. full: the whole matrix in script/config.sh (hours on a 4-CPU runner)"
        type: choice
        options: [smoke, full]
        default: smoke
      frameworks:
        description: "Comma-separated framework subset, e.g. gorilla,nbio_nonblocking (empty = all; ignored by smoke, which forces gorilla)"
        type: string
        default: ""
      client:
        description: "Benchmark client"
        type: choice
        options: [benchcli-uwscpp, benchcli-go]
        default: benchcli-uwscpp
      taskpool:
        description: "BENCH_TASKPOOL (empty = fib_adaptive, the script default)"
        type: string
        default: ""
      cpus:
        description: "DOCKER_BENCH_CPUS, an integer; the runner needs at least this many"
        type: string
        default: "8"
      memory:
        description: "DOCKER_BENCH_MEMORY, e.g. 12g (empty = 80% of what Docker exposes)"
        type: string
        default: ""
      benchmark_args:
        description: "Extra benchmark client flags, e.g. -c=10000 -en=2000000 -b=1024"
        type: string
        default: ""
      rebuild:
        description: "Rebuild the image without Docker's layer cache"
        type: boolean
        default: false

# One benchmark at a time: two of them on the same runner pool measure each
# other rather than the frameworks. A run already going is left to finish; of
# the ones waiting behind it, GitHub keeps only the newest, so a burst of
# pushes queues one run for the latest commit rather than one per commit.
concurrency:
  group: docker-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    # x86_64. ubuntu-latest may move to arm64 runners; this label does not.
    runs-on: ${{ vars.DOCKER_BENCH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360

    # The inputs with a push's defaults filled in; a dispatch passes its own.
    env:
      BENCH_MODE: ${{ inputs.mode || 'full' }}
      BENCH_CPUS: ${{ inputs.cpus || '8' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the runner is x86_64
        run: |
          arch=$(uname -m)
          echo "runner architecture: $arch"
          if [ "$arch" != "x86_64" ]; then
            echo "this workflow measures x86_64; got $arch" >&2
            exit 1
          fi
          # Checked here rather than left to docker_benchmark.sh, which would
          # only find out after building the image.
          cpus=$(nproc)
          echo "runner CPUs: $cpus, benchmark wants: $BENCH_CPUS"
          if ! [[ "$BENCH_CPUS" =~ ^[0-9]+$ ]]; then
            echo "cpus must be an integer; got $BENCH_CPUS" >&2
            exit 1
          fi
          if [ "$cpus" -lt "$BENCH_CPUS" ]; then
            echo "the benchmark wants $BENCH_CPUS CPUs, but this runner has $cpus;" \
              "set the repository variable DOCKER_BENCH_RUNNER to a runner with at least $BENCH_CPUS" >&2
            exit 1
          fi
          free -h
          df -h /
          docker version

      - name: Run script/docker_benchmark.sh
        env:
          # Read through env rather than interpolated into the script body, so
          # an input cannot become shell of its own.
          INPUT_MODE: ${{ env.BENCH_MODE }}
          INPUT_FRAMEWORKS: ${{ inputs.frameworks }}
          INPUT_CLIENT: ${{ inputs.client || 'benchcli-uwscpp' }}
          INPUT_TASKPOOL: ${{ inputs.taskpool }}
          INPUT_CPUS: ${{ env.BENCH_CPUS }}
          INPUT_MEMORY: ${{ inputs.memory }}
          INPUT_BENCHMARK_ARGS: ${{ inputs.benchmark_args }}
          INPUT_REBUILD: ${{ inputs.rebuild || false }}
          # A fixed directory instead of the script's timestamped one, so the
          # upload and summary steps below know where the run landed.
          DOCKER_BENCH_OUTPUT: ${{ github.workspace }}/output/docker/ci
        run: |
          set -euo pipefail

          export BENCH_CLIENT="$INPUT_CLIENT"
          # Only the ones actually given: these variables all fall back to a
          # default in script/config.sh when unset, and an empty value is not
          # that default.
          if [ -n "$INPUT_FRAMEWORKS" ]; then export BENCH_FRAMEWORKS="$INPUT_FRAMEWORKS"; fi
          if [ -n "$INPUT_TASKPOOL" ]; then export BENCH_TASKPOOL="$INPUT_TASKPOOL"; fi
          if [ -n "$INPUT_CPUS" ]; then export DOCKER_BENCH_CPUS="$INPUT_CPUS"; fi
          if [ -n "$INPUT_MEMORY" ]; then export DOCKER_BENCH_MEMORY="$INPUT_MEMORY"; fi

          # Built up in one array rather than as separate ones, which keeps it
          # off an empty "${array[@]}" - an unbound variable under set -u on
          # the bash 3.2 someone may run this body under locally.
          bench_command=(bash script/docker_benchmark.sh)
          if [ "$INPUT_MODE" = smoke ]; then bench_command+=(--smoke); fi
          if [ "$INPUT_REBUILD" = true ]; then bench_command+=(--rebuild); fi
          # Split on purpose: this input carries several client flags.
          if [ -n "$INPUT_BENCHMARK_ARGS" ]; then
            read -r -a extra_args <<< "$INPUT_BENCHMARK_ARGS"
            bench_command+=("${extra_args[@]}")
          fi

          echo "running: ${bench_command[*]}"
          "${bench_command[@]}"

      - name: Write the report to the job summary
        if: always()
        run: |
          result_dir=output/docker/ci
          {
            if [ -f "$result_dir/resources.txt" ]; then
              echo "## Run"
              echo
              echo '```'
              cat "$result_dir/resources.txt"
              echo '```'
              echo
            fi
            for table in Connections BenchEcho BenchRate; do
              if [ -f "$result_dir/report/$table.md" ]; then
                echo "## $table"
                echo
                cat "$result_dir/report/$table.md"
                echo
              fi
            done
            if [ ! -f "$result_dir/report/Connections.md" ]; then
              echo "No report tables were produced; see the console log in the artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-benchmark-${{ env.BENCH_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/docker/ci
          if-no-files-found: warn
          retention-days: 30
