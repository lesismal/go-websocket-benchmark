# Runs script/docker_benchmark.sh on an x86_64 runner.
#
# Runs the full matrix on every push to main, and can also be started by hand
# from the Actions tab with the inputs below - the same knobs script/config.sh
# documents. A push has no inputs, so every one of them falls back to the
# default given in the job's env block.
#
# A run is four benchmarks, one job each, at 100, 500, 1000 and 5000
# connections (the job's strategy below says how BenchPipeline is set for
# each); smoke runs only the first of them.
#
# The benchmark asks for 8 CPUs, which the standard GitHub-hosted runner (a
# shared 4-CPU VM) does not have. Point the repository variable
# DOCKER_BENCH_RUNNER (Settings > Secrets and variables > Actions > Variables)
# at the label of a runner with at least 8 CPUs - a larger GitHub-hosted runner
# or a self-hosted one. Until it is set, the job runs on ubuntu-24.04 and falls
# back to every CPU that runner has: the run still passes, but its numbers are
# for 4 CPUs rather than 8, which the job summary and resources.txt say, and
# the full matrix takes hours there.
name: Docker benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke: short gorilla-only run. full: the whole matrix in script/config.sh (hours on a 4-CPU runner)"
        type: choice
        options: [smoke, full]
        default: smoke
      frameworks:
        description: "Comma-separated framework subset, e.g. gorilla,nbio_nonblocking (empty = all; ignored by smoke, which forces gorilla)"
        type: string
        default: ""
      client:
        description: "Benchmark client"
        type: choice
        options: [benchcli-uwscpp, benchcli-rust, benchcli-go]
        default: benchcli-uwscpp
      taskpool:
        description: "BENCH_TASKPOOL (empty = default, each framework's own scheduling, the script default)"
        type: string
        default: ""
      cpus:
        description: "DOCKER_BENCH_CPUS, an integer; a runner with fewer runs on all of its own"
        type: string
        default: "8"
      memory:
        description: "DOCKER_BENCH_MEMORY, e.g. 12g (empty = 80% of what Docker exposes)"
        type: string
        default: ""
      benchmark_args:
        description: "Extra benchmark client flags, e.g. -en=2000000 -b=1024; given to every job, after its own -c, -rr and -rpl, so a -c here makes them all that"
        type: string
        default: ""
      rebuild:
        description: "Rebuild the image without Docker's layer cache"
        type: boolean
        default: false

# One benchmark at a time: two of them on the same runner pool measure each
# other rather than the frameworks (which is also why the jobs below run one
# after another). A run already going is left to finish; of
# the ones waiting behind it, GitHub keeps only the newest, so a burst of
# pushes queues one run for the latest commit rather than one per commit.
concurrency:
  group: docker-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    # x86_64. ubuntu-latest may move to arm64 runners; this label does not.
    runs-on: ${{ vars.DOCKER_BENCH_RUNNER || 'ubuntu-24.04' }}
    name: benchmark (${{ matrix.conns }} conns)
    timeout-minutes: 360

    # One job per connection count, one after another, each on a runner of its
    # own. BenchPipeline is set to offer 10M messages a second at every count
    # (-c x -rr), more than any framework reads back, so that the fastest one
    # is held back by neither the rate nor the client's send loop: the
    # 4-CPU runner's best was 2.06M/s (10000 connections, unlimited -rr), and
    # on an M-series Mac with the same -cput=4 uws_std read back 7.3M, 6.2M,
    # 5.1M and 5.1M of these 10M. That loop sends a connection at most one
    # -rpl batch per 1ms tick and keeps at most 5 batches in flight, which
    # is why -rpl grows as the count shrinks: -rr <= -rpl x 500 leaves it a
    # batch every 2ms or more. The default batch (-rbs/frame, 15 at 1KiB)
    # would cap 100 connections at 1.5M/s even at an unlimited -rr. -rr must
    # also be a multiple of -rpl, or the clients shrink the batch until it is.
    #   conns     -rr   -rpl  batches/s/conn  in flight
    #     100  100000   200        500         100000
    #     500   20000    40        500         100000
    #    1000   10000    20        500         100000
    #    5000    2000    20        100         500000
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON((inputs.mode || 'full') == 'smoke' && '{"include":[{"conns":100,"rr":100000,"rpl":200}]}' || '{"include":[{"conns":100,"rr":100000,"rpl":200},{"conns":500,"rr":20000,"rpl":40},{"conns":1000,"rr":10000,"rpl":20},{"conns":5000,"rr":2000,"rpl":20}]}') }}

    # The inputs with a push's defaults filled in; a dispatch passes its own.
    # BENCH_CPUS is what was asked for; the runner check sets BENCH_RUN_CPUS
    # to what the run actually gets.
    env:
      BENCH_MODE: ${{ inputs.mode || 'full' }}
      BENCH_CPUS: ${{ inputs.cpus || '8' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the runner is x86_64
        run: |
          arch=$(uname -m)
          echo "runner architecture: $arch"
          if [ "$arch" != "x86_64" ]; then
            echo "this workflow measures x86_64; got $arch" >&2
            exit 1
          fi
          # Checked here rather than left to docker_benchmark.sh, which would
          # only find out after building the image.
          cpus=$(nproc)
          echo "runner CPUs: $cpus, benchmark wants: $BENCH_CPUS"
          if ! [[ "$BENCH_CPUS" =~ ^[0-9]+$ ]]; then
            echo "cpus must be an integer; got $BENCH_CPUS" >&2
            exit 1
          fi
          run_cpus=$BENCH_CPUS
          if [ "$cpus" -lt "$BENCH_CPUS" ]; then
            # Run on what there is rather than not at all, and say so where
            # the results are read.
            run_cpus=$cpus
            echo "::warning title=Benchmark ran on $cpus of the $BENCH_CPUS CPUs asked for::this runner has $cpus CPUs, so the results are for $cpus, not the $BENCH_CPUS asked for; set the repository variable DOCKER_BENCH_RUNNER to a runner with at least $BENCH_CPUS"
          fi
          echo "BENCH_RUN_CPUS=$run_cpus" >> "$GITHUB_ENV"
          free -h
          df -h /
          docker version

      - name: Run script/docker_benchmark.sh
        env:
          # Read through env rather than interpolated into the script body, so
          # an input cannot become shell of its own.
          INPUT_MODE: ${{ env.BENCH_MODE }}
          INPUT_FRAMEWORKS: ${{ inputs.frameworks }}
          INPUT_CLIENT: ${{ inputs.client || 'benchcli-uwscpp' }}
          INPUT_TASKPOOL: ${{ inputs.taskpool }}
          INPUT_CPUS: ${{ env.BENCH_RUN_CPUS }}
          INPUT_MEMORY: ${{ inputs.memory }}
          INPUT_BENCHMARK_ARGS: ${{ inputs.benchmark_args }}
          INPUT_REBUILD: ${{ inputs.rebuild || false }}
          # A fixed directory instead of the script's timestamped one, so the
          # upload and summary steps below know where the run landed.
          DOCKER_BENCH_OUTPUT: ${{ github.workspace }}/output/docker/ci-c${{ matrix.conns }}
          MATRIX_CONNS: ${{ matrix.conns }}
          MATRIX_RR: ${{ matrix.rr }}
          MATRIX_RPL: ${{ matrix.rpl }}
        run: |
          set -euo pipefail

          export BENCH_CLIENT="$INPUT_CLIENT"
          # Only the ones actually given: these variables all fall back to a
          # default in script/config.sh when unset, and an empty value is not
          # that default.
          if [ -n "$INPUT_FRAMEWORKS" ]; then export BENCH_FRAMEWORKS="$INPUT_FRAMEWORKS"; fi
          if [ -n "$INPUT_TASKPOOL" ]; then export BENCH_TASKPOOL="$INPUT_TASKPOOL"; fi
          if [ -n "$INPUT_CPUS" ]; then export DOCKER_BENCH_CPUS="$INPUT_CPUS"; fi
          if [ -n "$INPUT_MEMORY" ]; then export DOCKER_BENCH_MEMORY="$INPUT_MEMORY"; fi

          # Built up in one array rather than as separate ones, which keeps it
          # off an empty "${array[@]}" - an unbound variable under set -u on
          # the bash 3.2 someone may run this body under locally.
          bench_command=(bash script/docker_benchmark.sh)
          if [ "$INPUT_MODE" = smoke ]; then bench_command+=(--smoke); fi
          if [ "$INPUT_REBUILD" = true ]; then bench_command+=(--rebuild); fi
          # This job's connection count and BenchPipeline rate, after smoke's
          # own flags and before the input's, so that one given there wins.
          bench_command+=("-c=$MATRIX_CONNS" "-rr=$MATRIX_RR" "-rpl=$MATRIX_RPL")
          # Split on purpose: this input carries several client flags.
          if [ -n "$INPUT_BENCHMARK_ARGS" ]; then
            read -r -a extra_args <<< "$INPUT_BENCHMARK_ARGS"
            bench_command+=("${extra_args[@]}")
          fi

          echo "running: ${bench_command[*]}"
          "${bench_command[@]}"

      - name: Write the report to the job summary
        if: always()
        run: |
          result_dir=output/docker/ci-c${{ matrix.conns }}
          run_cpus=${BENCH_RUN_CPUS:-$BENCH_CPUS}
          if [ "$run_cpus" = "$BENCH_CPUS" ]; then
            cpu_note="CPUs: $run_cpus"
          else
            cpu_note="CPUs: $run_cpus (asked for $BENCH_CPUS; this runner has only $run_cpus, so these are not $BENCH_CPUS-CPU numbers)"
          fi
          # Into the artifact as well, which outlives the summary.
          if [ -f "$result_dir/resources.txt" ]; then
            echo "Benchmark $cpu_note" >> "$result_dir/resources.txt"
          fi
          {
            echo "# ${{ matrix.conns }} connections"
            echo
            echo "**$cpu_note**"
            echo
            if [ -f "$result_dir/resources.txt" ]; then
              echo "## Run"
              echo
              echo '```'
              cat "$result_dir/resources.txt"
              echo '```'
              echo
            fi
            for table in Summary Connections BenchEcho BenchPipeline; do
              if [ -f "$result_dir/report/$table.md" ]; then
                echo "## $table"
                echo
                cat "$result_dir/report/$table.md"
                echo
              fi
            done
            if [ ! -f "$result_dir/report/Connections.md" ]; then
              echo "No report tables were produced; see the console log in the artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-benchmark-${{ env.BENCH_MODE }}-c${{ matrix.conns }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/docker/ci-c${{ matrix.conns }}
          if-no-files-found: warn
          retention-days: 30
